<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadzone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Deadzone</h1>
    <p>Use the left/right arrows or <code>A</code>/<code>D</code> to move and <code>Space</code> to shoot.</p>
    <div class="hud">
      <span id="score">Score: 0</span>
      <span id="lives">Lives: 3</span>
    </div>
    <div class="game-stage">
      <div id="startMenu" class="start-menu">
        <div class="start-menu__content">
          <h2>Ready to survive?</h2>
          <p>Defend your base from the incoming zombies.</p>
          <button id="startButton" type="button">Start</button>
        </div>
      </div>
      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <p class="footer">Press R to restart or Esc to quit after you lose.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
