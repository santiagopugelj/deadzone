<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zombie Shooter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Zombie Shooter</h1>
    <p>Usa las flechas izquierda/derecha o <code>A</code>/<code>D</code> para moverte y <code>Espacio</code> para disparar.</p>
    <div class="hud">
      <span id="score">Puntuación: 0</span>
      <span id="lives">Vidas: 3</span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <p class="footer">Presiona R para reiniciar o Esc para salir después de perder.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
