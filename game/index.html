<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadzone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="game-layout">
      <div class="game-stage">
        <div id="startMenu" class="start-menu">
          <div class="start-menu__content">
            <h2>Ready to survive?</h2>
            <p>Defend your base from the incoming zombies.</p>
            <p>Use left/right arrows or <code>A</code>/<code>D</code> to move and <code>Space</code> to shoot.</p>
            <p>Press Enter or click Start to begin.</p>
            <button id="startButton" type="button">Start</button>
          </div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
      </div>
      <aside class="side-panel">
        <div class="hud-title">DEAD<br>ZONE</div>
        <div class="hud">
          <span id="score">Score: 0</span>
          <span id="lives">Lives: 3</span>
          <span id="highScore">High Score: 0</span>
        </div>
        <div class="game-controls">
          <button id="pauseButton" type="button" disabled>Pause</button>
        </div>
      </aside>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
